[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lobsterai2api"
version = "1.0.0"
description = "LobsterAI OpenAI-compatible API bridge"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "pydantic-settings==2.14.2",
    "redis==8.1.0",
    "uvicorn[standard]==0.53.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
